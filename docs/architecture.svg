<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Kafka Sim 架构</title>
<desc id="desc">React 页面通过 HTTP 调用 Producer，Producer 写入 Broker。三个消费者分别向 Broker 发起 Fetch / Commit，并保存到各自的 JSON 文件。</desc>
